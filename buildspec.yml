version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Install phase started"

      # Create Maven directory
      - mkdir -p /root/.m2

      # Copy settings.xml BEFORE any Maven command
      - cp -pvr settings.xml /root/.m2/settings.xml

      # Verify file exists
      - cat /root/.m2/settings.xml

      # Get CodeArtifact token
      - export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain ssk --domain-owner 563184259844 --region ap-south-1 --query authorizationToken --output text)

      # Verify token exists
      - echo "Token fetched successfully"

      # Resolve dependencies
      - mvn clean install -DskipTests

  build:
    commands:
      - echo "Build phase started"

      # Deploy artifact to CodeArtifact
      - mvn deploy -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully"
      - ls -la target

artifacts:
  files:
    - target/*.jar
  discard-paths: yes