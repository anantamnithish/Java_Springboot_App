version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Entering install phase
      - mvn -q -DskipTests dependency:resolve

  pre_build:
    commands:
      - echo Entering pre_build phase
      - mvn -q validate

  build:
    commands:
      - echo Entering build phase
      - mvn -q clean verify

  post_build:
    commands:
      - echo Build completed
      - ls -la target

artifacts:
  files:
    - target/*.jar
  discard-paths: yes

reports:
  junit:
    files:
      - target/surefire-reports/*.xml
    base-directory: target/surefire-reports
    discard-paths: yes
