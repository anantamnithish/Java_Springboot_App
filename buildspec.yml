version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Install phase started"
      - mkdir -p /root/.m2
      - cp -pvr settings.xml /root/.m2/settings.xml
      - ls -lrta /root/.m2/settings.xml
      - echo "Verifying JFrog Artifactory connectivity..."
      #- curl -u admin:Subramanyam@2175 -I http://40.192.38.134:8082/artifactory/ssk-release/ || echo "Warning: Could not connect to Artifactory"
  build:
    commands:
      - echo "Build phase started"
      - echo "Building with Maven and deploying to JFrog Artifactory..."
      - mvn clean package deploy -DskipTests
      - echo "Running SonarQube analysis..."
      - mvn sonar:sonar -Dsonar.projectKey=Java_Spring_App -Dsonar.projectName='Java_Spring_App' -Dsonar.host.url=http://16.112.225.192:9000 -Dsonar.token=sqp_80be4fe97a54ff182b525c859f7e07a95720bd67
  post_build:
    commands:
      - echo "Build completed successfully"
      - echo "Artifacts deployed to JFrog Artifactory"
      - ls -la target

artifacts:
  files:
    - target/*.jar
  discard-paths: yes